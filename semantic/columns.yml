        type: numerica
        null_meaning: No debería ser NULL.
        universe: Todos los hogares.
        weight: PONDERA
        synonyms: [ponderador, peso, expansión]
      cantidad_miembros:
        source: IX_TOT
        description: Cantidad total de miembros del hogar.
        type: numerica
        null_meaning: No debería ser NULL.
        universe: Todos los hogares.
        synonyms: [miembros, tamaño del hogar, personas]
