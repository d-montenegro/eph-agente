          - Corrientes
          - Gran Córdoba
          - Concordia
          - Formosa
          - Neuquén-Plottier
          - Santiago del Estero-La Banda
          - Jujuy-Palpalá
          - Río Gallegos
          - Gran Catamarca
          - Gran Salta
          - La Rioja
          - Gran San Luis
          - Gran San Juan
          - Gran Tucumán-Tafí Viejo
          - Santa Rosa-Toay
          - Ushuaia-Río Grande
          - Ciudad Autónoma de Buenos Aires
          - Partidos del Gran Buenos Aires
          - Mar del Plata
          - Río Cuarto
          - San Nicolás-Villa Constitución
          - Rawson-Trelew
          - Viedma-Carmen de Patagones
        null_meaning: No se documenta un NULL.
        universe: Todos los hogares.
        synonyms: [ciudad, aglomerado, región urbana]
      region:
        source: REGION
