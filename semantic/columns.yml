        synonyms: [vivienda, identificador]
      nro_hogar:
        source: NRO_HOGAR
        description: Número de hogar dentro de la vivienda.
        type: identificador
        null_meaning: No debería ser NULL.
        universe: Todos los hogares.
        synonyms: [hogar]
        notes: Junto con CODUSU identifica unívocamente el hogar.
      anio:
        source: ANO4
        description: Año de la encuesta.
        type: numerica
        null_meaning: No debería ser NULL.
        universe: Todos los hogares.
        synonyms: [año, periodo]
      trimestre:
