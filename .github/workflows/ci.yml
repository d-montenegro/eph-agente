name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra postgres
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Construir base y capa semántica
        run: |
          uv run python src/eph_a_sqlite.py
          PYTHONPATH=src uv run python -m eph_agent.semantic --db eph.sqlite --validate
      - name: Smoke determinístico del golden set
        run: >-
          PYTHONPATH=src uv run python -m eph_agent.evaluation
          --golden eval/golden.yml --reference --out eval/runs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
