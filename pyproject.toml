[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eph-agente"
version = "0.1.0"
description = "Agente auditable de consultas en lenguaje natural sobre la EPH"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas==3.1.0",
  "pyyaml>=6.0,<7",
  "sqlglot>=25,<29",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["eph_agent*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI usa Depends(...) como valor por defecto de forma idiomática.
"src/eph_agent/api.py" = ["B008"]
