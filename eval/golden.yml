  - id: lab_006
    pregunta: "¿Cuál fue la tasa de desocupación por sexo en el 1T 2026?"
    tipo: tabla
    unidad: fraccion
    tolerancia: 0.001
    columns: [sexo, tasa_desocupacion]
    rows:
      - [Mujer, 0.082700]
      - [Varón, 0.074723]
    categoria: tasas_laborales
    dificultad: media
    fuente: "Cálculo de referencia sobre microdatos EPH 1T 2026; pendiente informe INDEC"
    sql_esperado: >-
      SELECT sexo,
             SUM(CASE WHEN estado_actividad = 'Desocupado' THEN pondera ELSE 0 END) * 1.0
             / SUM(CASE WHEN estado_actividad IN ('Ocupado', 'Desocupado') THEN pondera ELSE 0 END)
             AS tasa_desocupacion
      FROM personas GROUP BY sexo
    reglas_sql:
      vistas: [personas]
      columnas: [pondera]
      texto: [Desocupado, Ocupado]
    supuestos:
      - Se usa PONDERA.
      - El denominador es la población activa de cada sexo.

