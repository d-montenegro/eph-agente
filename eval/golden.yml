    unidad: absoluta
    tolerancia: 500
    categoria: ingresos
    dificultad: media
    fuente: "Cálculo de referencia sobre microdatos; la brecha de género de 29,0% coincide con INDEC, Cuadro 5.2"
    sql_esperado: >-
      SELECT SUM(ingreso_ocupacion_principal * pondera_ingreso_ocupacion) * 1.0
             / SUM(pondera_ingreso_ocupacion)
      FROM personas
