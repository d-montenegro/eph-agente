  - id: ing_001
    pregunta: "¿Cuál es el ingreso medio de la ocupación principal de los ocupados con ingresos en el 1T 2026?"
    tipo: numero
    valor_esperado: 1104227
    unidad: absoluta
    tolerancia: 200
    categoria: ingresos
    dificultad: media
    fuente: "INDEC, Evolución de la distribución del ingreso (EPH), 1T 2026, p. 9: $1.104.227"
    sql_esperado: >-
      SELECT SUM(ingreso_ocupacion_principal * pondera_ingreso_ocupacion) * 1.0
             / SUM(pondera_ingreso_ocupacion)
      FROM personas
      WHERE estado_actividad = 'Ocupado' AND ingreso_ocupacion_principal > 0
    reglas_sql:
      vistas: [personas]
      columnas: [ingreso_ocupacion_principal, pondera_ingreso_ocupacion]
      texto: [Ocupado]
    supuestos:
      - Se usa PONDIIO, no PONDERA.
      - Se excluyen los ocupados sin ingresos, como en el informe del INDEC.

