# Golden set visible. Los valores se calcularon sobre los microdatos del 1T 2026
# y quedan pendientes de validación contra el informe técnico del INDEC.
casos:
  - id: lab_001
    pregunta: "¿Cuál fue la tasa de desocupación total en el 1T 2026?"
    tipo: numero
    valor_esperado: 0.078309
    unidad: fraccion
    tolerancia: 0.0005
    categoria: tasas_laborales
    dificultad: baja
    fuente: "Cálculo de referencia sobre microdatos EPH 1T 2026; pendiente informe INDEC"
    sql_esperado: >-
      SELECT SUM(CASE WHEN estado_actividad = 'Desocupado' THEN pondera ELSE 0 END) * 1.0
             / SUM(CASE WHEN estado_actividad IN ('Ocupado', 'Desocupado') THEN pondera ELSE 0 END)
      FROM personas
    reglas_sql:
      vistas: [personas]
      columnas: [pondera]
      texto: [Desocupado, Ocupado]
    supuestos:
      - Se usa el ponderador general PONDERA.
      - El denominador es la población activa (ocupados + desocupados).

