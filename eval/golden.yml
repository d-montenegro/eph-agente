version: 1
periodo:
  anio: 2026
  trimestre: 1

# Golden set visible. Los valores se calcularon sobre los microdatos del 1T 2026
# y quedan pendientes de validación contra el informe técnico del INDEC.
casos:
  - id: lab_001
    pregunta: "¿Cuál fue la tasa de desocupación total en el 1T 2026?"
    tipo: numero
    valor_esperado: 0.078309
    unidad: fraccion
    tolerancia: 0.0005
    categoria: tasas_laborales
    dificultad: baja
    fuente: "Cálculo de referencia sobre microdatos EPH 1T 2026; pendiente informe INDEC"
    sql_esperado: >-
      SELECT SUM(CASE WHEN estado_actividad = 'Desocupado' THEN pondera ELSE 0 END) * 1.0
             / SUM(CASE WHEN estado_actividad IN ('Ocupado', 'Desocupado') THEN pondera ELSE 0 END)
      FROM personas
    reglas_sql:
      vistas: [personas]
      columnas: [pondera]
      texto: [Desocupado, Ocupado]
    supuestos:
      - Se usa el ponderador general PONDERA.
      - El denominador es la población activa (ocupados + desocupados).

  - id: lab_002
    pregunta: "¿Cuál fue la tasa de desocupación en Gran Córdoba en el 1T 2026?"
    tipo: numero
    valor_esperado: 0.088062
    unidad: fraccion
    tolerancia: 0.0005
    categoria: tasas_laborales
    dificultad: baja
    fuente: "Cálculo de referencia sobre microdatos EPH 1T 2026; pendiente informe INDEC"
    sql_esperado: >-
      SELECT SUM(CASE WHEN estado_actividad = 'Desocupado' THEN pondera ELSE 0 END) * 1.0
             / SUM(CASE WHEN estado_actividad IN ('Ocupado', 'Desocupado') THEN pondera ELSE 0 END)
      FROM personas WHERE aglomerado = 'Gran Córdoba'
    reglas_sql:
      vistas: [personas]
      columnas: [pondera]
      texto: [Gran Córdoba, Desocupado, Ocupado]
    supuestos:
      - Se usa PONDERA.
      - El denominador es la población activa del aglomerado.

  - id: lab_003
    pregunta: "¿Cuál fue la tasa de actividad total en el 1T 2026?"
    tipo: numero
    valor_esperado: 0.560534
    unidad: fraccion
    tolerancia: 0.0005
    categoria: tasas_laborales
    dificultad: media
    fuente: "Cálculo de referencia sobre microdatos EPH 1T 2026; pendiente informe INDEC"
    sql_esperado: >-
      SELECT SUM(CASE WHEN estado_actividad IN ('Ocupado', 'Desocupado') THEN pondera ELSE 0 END) * 1.0
             / SUM(pondera)
      FROM personas WHERE estado_actividad IN ('Ocupado', 'Desocupado', 'Inactivo')
    reglas_sql:
      vistas: [personas]
      columnas: [pondera]
      texto: [Ocupado, Desocupado, Inactivo]
    supuestos:
      - Se usa PONDERA.
      - El denominador es la población de 10 años y más (ESTADO 1, 2 o 3); excluye menores y no respuesta.

