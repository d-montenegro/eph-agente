# Perfil público para la demo en Render usando OpenRouter.
# La clave se inyecta únicamente como secreto EPH_LLM_API_KEY.

mode: hosted

# Solo se permiten hosts de esta lista; sin lista no hay destinos remotos.
allowed_hosts:
  - openrouter.ai

profiles:
  openrouter-free:
    base_url: https://openrouter.ai/api/v1
    model: openrouter/free
    api_mode: chat_completions
    api_key_env: EPH_LLM_API_KEY
    timeout_seconds: 60
    max_retries: 2
    enabled: true
    hosted: true
