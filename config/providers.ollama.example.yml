# Perfil local con Ollama, sin API key.
# Uso: EPH_PROVIDERS_FILE=config/providers.ollama.example.yml make api

mode: local
profiles:
  local:
    base_url: http://127.0.0.1:11434/v1
    model: qwen2.5:7b
    api_mode: chat_completions
    api_key_env: OLLAMA_API_KEY
    timeout_seconds: 120
    max_retries: 0
    enabled: true
    hosted: false
